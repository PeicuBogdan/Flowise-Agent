services:
  mock-api:
    build: ./mock-api
    container_name: station-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  flowise:
    image: flowiseai/flowise:3.1.3
    container_name: flowise
    ports:
      - "3100:3000"
    volumes:
      - flowise_data:/root/.flowise
    environment:
      - TOOL_FUNCTION_BUILTIN_DEP=*
      - TOOL_FUNCTION_EXTERNAL_DEP=axios,node-fetch
      - HTTP_SECURITY_CHECK=false
      - HTTP_DENY_LIST=169.254.169.254/32
    depends_on:
      - mock-api
    restart: unless-stopped

volumes:
  flowise_data:
    external: true